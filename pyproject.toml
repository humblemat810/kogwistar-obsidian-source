[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kogwistar-obsidian-source"
version = "0.1.0"
description = "Explicit, revision-safe bidirectional Obsidian source plugin for LLM-Wiki"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm-wiki = ["kogwistar-llm-wiki>=0.5.12,<0.6"]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1"]

[project.entry-points."kogwistar_llm_wiki.workbench_extensions"]
obsidian-source = "kogwistar_obsidian_source.plugin:build_workbench_extension"

[project.scripts]
kogwistar-obsidian-source = "kogwistar_obsidian_source.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src", "../kogwistar"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src"]

