name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: cpython312
            python-version: "3.12"
          - label: cpython313
            python-version: "3.13"
          - label: cpython314
            python-version: "3.14"
          - label: pypy311
            python-version: pypy-3.11-v7.3.20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest ruff pyright
      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Ruff
        run: python -m ruff check src tests --select E4,E7,E9,F
      - name: Pyright
        run: pyright src tests
      - name: Diff check
        run: git diff --check
