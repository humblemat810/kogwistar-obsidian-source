[workspace]
resolver = "2"
members = ["crates/kogwistar-obsidian-source"]

[workspace.package]
edition = "2021"
license = "Proprietary"
repository = "https://github.com/humblemat810/kogwistar-obsidian-source"

[workspace.dependencies]
anyhow = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
